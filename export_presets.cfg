; Android export presets. They contain no keys or passwords: signing comes from
; GODOT_ANDROID_KEYSTORE_* environment variables (set by CI from GitHub secrets)
; or from your own Godot editor settings.

; Test build: installable APK, debug-signed, separate package so it can sit
; next to the Play Store version on the same phone.
[preset.0]

name="Android"
platform="Android"
runnable=true
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter=""
exclude_filter="tests/*, docs/*, tools/*"
export_path="build/RsLUDO-debug.apk"
encryption_include_filters=""
encryption_exclude_filters=""
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

[preset.0.options]

custom_template/debug=""
custom_template/release=""
gradle_build/use_gradle_build=false
gradle_build/export_format=0
architectures/armeabi-v7a=true
architectures/arm64-v8a=true
architectures/x86=false
architectures/x86_64=false
version/code=1
version/name="0.2.0"
package/unique_name="com.rsludo.game.debug"
package/name="RS Ludo Test"
package/signed=true
package/retain_data_on_uninstall=false
package/exclude_from_recents=false
screen/immersive_mode=true
screen/support_small=true
screen/support_normal=true
screen/support_large=true
screen/support_xlarge=true

; Google Play build: Android App Bundle (AAB), release-signed with the upload key.
; CI sets version/code to a new, higher number for every build.
