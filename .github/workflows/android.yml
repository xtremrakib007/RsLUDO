name: Android debug APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GODOT_VERSION: 4.4.1-stable
      TEMPLATES_DIR: /home/runner/.local/share/godot/export_templates/4.4.1.stable
      # Standard Android debug-key values; not secrets. Debug builds only.
      GODOT_ANDROID_KEYSTORE_DEBUG_PATH: /home/runner/debug-keystore/debug.keystore
      GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
      GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download Godot
        run: |
          curl -sSfL -o /tmp/godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d /tmp/godot
          mv "/tmp/godot/Godot_v${GODOT_VERSION}_linux.x86_64" /tmp/godot/godot

      - name: Restore Android export templates
        id: templates
        uses: actions/cache@v4
        with:
          path: ${{ env.TEMPLATES_DIR }}
          key: godot-android-templates-${{ env.GODOT_VERSION }}

      - name: Download Android export templates
        if: steps.templates.outputs.cache-hit != 'true'
        run: |
          curl -sSfL -o /tmp/templates.tpz "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_export_templates.tpz"
          mkdir -p "$TEMPLATES_DIR"
          unzip -j -o /tmp/templates.tpz templates/android_debug.apk templates/android_release.apk templates/version.txt -d "$TEMPLATES_DIR"
          rm /tmp/templates.tpz

      # Reusing one debug key lets a new APK install over the previous one.
      - name: Restore debug signing key
        id: keystore
        uses: actions/cache@v4
        with:
          path: /home/runner/debug-keystore
          key: android-debug-keystore-v1

      - name: Create debug signing key
        if: steps.keystore.outputs.cache-hit != 'true'
        run: |
          mkdir -p /home/runner/debug-keystore
          keytool -genkeypair -v -keystore "$GODOT_ANDROID_KEYSTORE_DEBUG_PATH" \
            -storepass android -keypass android -alias androiddebugkey \
            -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"

      - name: Point Godot at the Android SDK and Java
        run: |
          mkdir -p ~/.config/godot
          cat > ~/.config/godot/editor_settings-4.4.tres <<SETTINGS
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "${ANDROID_SDK_ROOT}"
          export/android/java_sdk_path = "${JAVA_HOME_17_X64}"
          SETTINGS
          cat ~/.config/godot/editor_settings-4.4.tres

      - name: Import project
        run: timeout 300 /tmp/godot/godot --headless --path . --import

      - name: Export debug APK
        run: |
          mkdir -p build
          timeout 600 /tmp/godot/godot --headless --path . --export-debug "Android" build/RsLUDO-debug.apk 2>&1 | tee export.log
          test -s build/RsLUDO-debug.apk || { echo "APK was not created"; exit 1; }
          ls -la build/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RsLUDO-debug-apk
          path: build/RsLUDO-debug.apk
          retention-days: 14
