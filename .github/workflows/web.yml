name: Web version (iPad / browser)

# Builds the game for web browsers on every push. On main it is published to
# GitHub Pages, so it can be played in Safari on iPad/iPhone or any browser.
# One-time setup: Settings > Pages > Build and deployment > Source: GitHub Actions.

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build web version
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GODOT_VERSION: 4.4.1-stable
      TEMPLATES_DIR: /home/runner/.local/share/godot/export_templates/4.4.1.stable
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download Godot
        run: |
          curl -sSfL -o /tmp/godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d /tmp/godot
          mv "/tmp/godot/Godot_v${GODOT_VERSION}_linux.x86_64" /tmp/godot/godot

      - name: Restore web export templates
        id: templates
        uses: actions/cache@v4
        with:
          path: ${{ env.TEMPLATES_DIR }}
          key: godot-web-templates-${{ env.GODOT_VERSION }}

      - name: Download web export templates
        if: steps.templates.outputs.cache-hit != 'true'
        run: |
          curl -sSfL -o /tmp/templates.tpz "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_export_templates.tpz"
          mkdir -p "$TEMPLATES_DIR"
          unzip -j -o /tmp/templates.tpz templates/web_nothreads_release.zip templates/web_nothreads_debug.zip templates/version.txt -d "$TEMPLATES_DIR"
          rm /tmp/templates.tpz

      - name: Import project
        run: timeout 300 /tmp/godot/godot --headless --path . --import

      - name: Export web version
        run: |
          mkdir -p build/web
          timeout 600 /tmp/godot/godot --headless --path . --export-release "Web" build/web/index.html 2>&1 | tee export.log
          test -s build/web/index.html || { echo "Web export failed"; exit 1; }
          ls -la build/web
          du -sh build/web

      - name: Keep the web build
        uses: actions/upload-artifact@v4
        with:
          name: RSLudo-web
          path: build/web
          retention-days: 7

      - name: Prepare for GitHub Pages
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    name: Publish to GitHub Pages
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
