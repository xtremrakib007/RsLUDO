name: Tests (Godot)

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Godot headless tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GODOT_VERSION: 4.4.1-stable
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Download Godot
        run: |
          curl -sSfL -o /tmp/godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d /tmp/godot
          mv "/tmp/godot/Godot_v${GODOT_VERSION}_linux.x86_64" /tmp/godot/godot
          /tmp/godot/godot --version
      - name: Import project
        run: timeout 300 /tmp/godot/godot --headless --path . --import 2>&1 | tee import.log
      - name: Run tests
        run: timeout 300 /tmp/godot/godot --headless --path . res://tests/test_runner.tscn 2>&1 | tee test.log
      - name: Fail on script errors
        run: |
          if grep -nE "SCRIPT ERROR|Parse Error|Failed to load script|Compile Error" import.log test.log; then
            echo "Script errors found (see above)."
            exit 1
          fi
