name: Tests (Godot)

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Godot headless tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GODOT_VERSION: 4.4.1-stable
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Download Godot
        run: |
          curl -sSfL -o /tmp/godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d /tmp/godot
          mv "/tmp/godot/Godot_v${GODOT_VERSION}_linux.x86_64" /tmp/godot/godot
          /tmp/godot/godot --version
      - name: Import project
        run: timeout 300 /tmp/godot/godot --headless --path . --import 2>&1 | tee import.log
      - name: Run tests
        run: timeout 300 /tmp/godot/godot --headless --path . res://tests/test_runner.tscn 2>&1 | tee test.log
      - name: Fail on script errors
        run: |
          if grep -nE "SCRIPT ERROR|Parse Error|Failed to load script|Compile Error" import.log test.log; then
            echo "Script errors found (see above)."
            exit 1
          fi

  screenshots:
    name: Screenshots for review
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GODOT_VERSION: 4.4.1-stable
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install a virtual display and software OpenGL
        run: sudo apt-get update -qq && sudo apt-get install -y -qq xvfb libgl1-mesa-dri > /dev/null
      - name: Download Godot
        run: |
          curl -sSfL -o /tmp/godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d /tmp/godot
          mv "/tmp/godot/Godot_v${GODOT_VERSION}_linux.x86_64" /tmp/godot/godot
      - name: Import project
        run: timeout 300 /tmp/godot/godot --headless --path . --import
      - name: Render screenshots
        run: |
          mkdir -p screenshots
          SCREENSHOT_DIR="$PWD/screenshots" timeout 300 xvfb-run -a -s "-screen 0 1280x1024x24" \
            /tmp/godot/godot --path . --rendering-driver opengl3 --resolution 720x1600 res://tools/screenshots.tscn
          ls -la screenshots
      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: screenshots/*.png
          retention-days: 7
